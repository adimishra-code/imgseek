[workspace]
resolver = "2"
members = [
    "crates/imgseek-core",
    "crates/imgseek-store",
    "crates/imgseek-index",
    "crates/imgseek-features",
    "crates/imgseek-query",
    "crates/imgseek-chrome",
    "crates/imgseek-crawl",
    "crates/imgseek-eval",
    "crates/imgseek-web",
    "crates/imgseek-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
