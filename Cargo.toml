[workspace]
resolver = "2"
members = [
    "crates/imgseek-core",
    "crates/imgseek-store",
    "crates/imgseek-index",
    "crates/imgseek-features",
    "crates/imgseek-query",
    "crates/imgseek-chrome",
    "crates/imgseek-crawl",
    "crates/imgseek-eval",
    "crates/imgseek-web",
    "crates/imgseek-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
